
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POTEPAN CAMP</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ヘッダー -->
  <header class="Header">
    <div class="HeaderContainer">

      <!-- ロゴ -->
      <a class="HeaderLogo" href="#">
        <img src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/logo/potepan-camp-orange.svg"
          alt="POTEPAN CAMP">
      </a>

      <!-- メニュー -->
      <nav class="HeaderNav">
        <ul class="HeaderMenu">

          <li>
            <a href="#">
              <span>CONTENT</span>
              <span>学習内容</span>
            </a>
          </li>

          <li>
            <a href="#">
              <span>INTERVIEW</span>
              <span>受講者の声</span>
            </a>
          </li>

          <li>
            <a href="#">
              <span>BLOG</span>
              <span>ブログ</span>
            </a>
          </li>

          <li>
            <a href="#">
              <span>RECRUIT</span>
              <span>採用企業様へ</span>
            </a>
          </li>

          <li>
            <a href="#">
              <span>TRAINING</span>
              <span>企業研修</span>
            </a>
          </li>

        </ul>

        <a class="HeaderButton" href="#">
          無料カウンセリング
        </a>

      </nav>
    </div>
  </header>


  <!-- ファーストビュー -->
  <main>

    <section class="FirstView">

      <!-- 左上のオレンジ三角形 -->
      <img
        class="FirstViewTriangleLeft"
        src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/left-rectangle.svg"
        alt=""
      >

      <!-- 右下のオレンジ三角形 -->
      <img
        class="FirstViewTriangleRight"
        src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/right-rectangle.svg"
        alt=""
      >

      <!-- 左側の曲線装飾 -->
      <img
        class="FirstViewDecoration"
        src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/fill-rectangle.svg"
        alt=""
      >


      <!-- キャッチコピー -->
      <div class="FirstViewContent">

        <h1 class="FirstViewTitle">
          実践的カリキュラムと<br>
          豊富な提携求人で<br>
          最速でWebエンジニアに
        </h1>

        <a class="CounselingButton" href="#">
          まずは無料カウンセリングへ
        </a>

        <p class="FirstViewNote">
          ※ショッパーズアイ「プログラミングスクール10社を対象にしたサイト比較イメージ調査<br>
（2020 年 5 月 22 日～25 日）」より全国の22～49歳の男女691名へのインターネット調査
        </p>

      </div>


      <!-- 右側の人物画像 -->
      <img
        class="FirstViewMainImage"
        src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/main-visual.webp"
        alt="パソコンで学習するエンジニア"
      >


      <!-- No.1バッジ -->
      <img
        class="FirstViewBadge"
        src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/badge.svg"
        alt="Webエンジニア輩出No.1"
      >

    </section>

  </main>

</body>
</html>
